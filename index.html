<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a1a">
  <title>הרוחביה</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1a1a1a; }
    iframe {
      display: block; width: 100%; height: 100%; border: 0;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      box-sizing: border-box; background: #fff;
    }
  </style>
</head>
<body>
  <iframe id="frame" title="הרוחביה"
          allow="fullscreen; clipboard-read; clipboard-write; web-share"
          allowfullscreen></iframe>

  <script>
    // Base64-encoded target URL. This only hides the address from a quick
    // glance at "view source" — anyone checking the Network tab, or just
    // running atob() on this string, sees the real URL immediately.
    const encoded = "aHR0cHM6Ly93d3cucm9jaGJpYS5jb20v";
    document.getElementById("frame").src = atob(encoded);
  </script>
</body>
</html>
